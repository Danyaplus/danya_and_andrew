<!doctype html>
<html lang="uk">
  <head>
    <script>
      // Apply saved theme before first paint to avoid a bright/dark flash.
      (function () {
        try {
          var mode = localStorage.getItem('codumi-appearance-mode') || 'auto';
          var hour = Number(new Intl.DateTimeFormat('en-GB', { timeZone: 'Europe/Kyiv', hour: '2-digit', hourCycle: 'h23' }).format(new Date()));
          var theme = mode === 'light' || mode === 'dark' ? mode : (hour >= 6 && hour < 18 ? 'light' : 'dark');
          document.documentElement.dataset.codumiTheme = theme;
          document.documentElement.style.colorScheme = theme;
          var cardStyle = localStorage.getItem('codumi-card-style') || 'classic';
          document.documentElement.dataset.codumiCardStyle = ['classic', 'glass', 'outline'].includes(cardStyle) ? cardStyle : 'classic';
        } catch (_) { document.documentElement.dataset.codumiTheme = 'dark'; }
      })();
    </script>

</html>
